<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>B24 Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--navy:#042D60;--blue:#0199E0;--orange:#FF6B35;--muted:#5B6B80;--line:#D9E1EA;--field:#F5F7FA;--tint:#E8F4FC;--err:#C7361A}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:#fff;font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.view{display:none;max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 22px calc(30px + env(safe-area-inset-bottom,0px))}
.view.on{display:block}
.logo{display:block;height:44px;width:auto;margin:18px 0 26px}
h1{font-size:26px;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 22px;line-height:1.6;font-size:15px}
label{display:block;font-size:14px;font-weight:500;margin:0 0 6px}
.in{width:100%;height:52px;border:1px solid var(--line);background:var(--field);border-radius:14px;padding:0 14px;font-size:16px;margin-bottom:14px;direction:ltr;text-align:start}
.in:focus{border-color:var(--blue);background:#fff}
.btn{width:100%;height:52px;border-radius:14px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;margin-top:6px}
.btn[disabled]{opacity:.6}
.lnk{display:block;margin:16px auto 0;color:var(--blue);font-weight:500;font-size:15px;padding:8px}
.msg{min-height:22px;margin:0 0 4px;font-size:14px;line-height:1.5;color:var(--err)}.msg.ok{color:#12805C}
/* home */
.top{display:flex;align-items:center;justify-content:space-between;height:44px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}.ib svg{width:24px;height:24px}
.top .logo{height:34px;margin:0}
.hello{margin:20px 0 2px;color:var(--muted)}
.sw{position:relative;margin:14px 0 22px}.sw svg{position:absolute;inset-inline-start:14px;top:16px;width:20px;height:20px;color:var(--muted)}
.sw input{width:100%;height:52px;border:1px solid var(--line);background:var(--field);border-radius:14px;padding:0 44px;font-size:15px}
.list{display:grid;gap:12px;padding-bottom:84px}
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:16px;border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 10px rgba(4,45,96,.05)}
.card:active{transform:scale(.985)}
.ico{flex:none;width:52px;height:52px;border-radius:14px;background:var(--tint);color:var(--blue);display:grid;place-items:center}.ico svg{width:26px;height:26px}
.txt{flex:1;min-width:0}.txt b{display:block;font-size:16px}.txt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.chev{width:20px;height:20px;color:#9AA7B8}
.tabs{position:fixed;inset-inline:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted)}.tab svg{width:24px;height:24px}
.tab.cur{color:var(--navy);font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(4,45,96,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(300px,82vw);background:#fff;transform:translateX(100%);transition:transform .28s;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px 18px;box-shadow:-8px 0 30px rgba(4,45,96,.18)}
body.open .scrim{opacity:1;pointer-events:auto}body.open .drawer{transform:none}
.av{width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;margin-bottom:10px}
.who{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:8px}.who small{color:var(--muted);direction:ltr;display:inline-block}
.mi{display:flex;align-items:center;gap:14px;height:50px;padding:0 10px;border-radius:12px;width:100%;text-align:start;font-weight:500}
.mi svg{width:22px;height:22px;color:var(--muted)}.mi.out{color:var(--err)}.mi.out svg{color:var(--err)}
.toast{position:fixed;inset-inline:0;bottom:84px;margin:0 auto;width:max-content;max-width:86%;background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.on{opacity:1}
</style>
</head>
<body>

<!-- Step 1: seat/university number -->
<section class="view on" id="v-num">
  <img class="logo" alt="B24 Portal">
  <h1>مرحباً بك</h1><p class="sub">أدخل رقمك الجامعي للتحقق أنك من دفعة 24.</p>
  <label for="num">الرقم الجامعي</label>
  <input class="in" id="num" inputmode="numeric" autocomplete="off" placeholder="24123456">
  <p class="msg" id="m-num"></p>
  <button class="btn" id="b-num">متابعة</button>
  <button class="lnk" data-go="v-login">لدي حساب؟ تسجيل الدخول</button>
</section>

<!-- Step 2: create account -->
<section class="view" id="v-reg">
  <img class="logo" alt="B24 Portal">
  <h1>إنشاء الحساب</h1><p class="sub">الرقم <b id="reg-num" dir="ltr"></b> متاح. أنشئ حسابك بالإيميل وكلمة سر.</p>
  <label for="r-email">الإيميل</label><input class="in" id="r-email" type="email" autocomplete="email">
  <label for="r-pw">كلمة السر (6 أحرف على الأقل)</label><input class="in" id="r-pw" type="password" autocomplete="new-password">
  <label for="r-pw2">تأكيد كلمة السر</label><input class="in" id="r-pw2" type="password" autocomplete="new-password">
  <p class="msg" id="m-reg"></p>
  <button class="btn" id="b-reg">إنشاء الحساب</button>
  <button class="lnk" data-go="v-num">رجوع</button>
</section>

<!-- Login -->
<section class="view" id="v-login">
  <img class="logo" alt="B24 Portal">
  <h1>تسجيل الدخول</h1><p class="sub">ستدخل مرة واحدة فقط، ثم يفتح التطبيق مباشرة.</p>
  <label for="l-email">الإيميل</label><input class="in" id="l-email" type="email" autocomplete="email">
  <label for="l-pw">كلمة السر</label><input class="in" id="l-pw" type="password" autocomplete="current-password">
  <p class="msg" id="m-login"></p>
  <button class="btn" id="b-login">دخول</button>
  <button class="lnk" data-go="v-forgot">نسيت كلمة السر؟</button>
  <button class="lnk" data-go="v-num">حساب جديد</button>
</section>

<!-- Forgot password -->
<section class="view" id="v-forgot">
  <img class="logo" alt="B24 Portal">
  <h1>نسيت كلمة السر</h1><p class="sub">أدخل إيميلك وسيصل طلبك للإدارة، وستتواصل معك بكلمة مؤقتة.</p>
  <label for="f-email">الإيميل</label><input class="in" id="f-email" type="email">
  <p class="msg" id="m-forgot"></p>
  <button class="btn" id="b-forgot">إرسال الطلب</button>
  <button class="lnk" data-go="v-login">رجوع</button>
</section>

<!-- Home -->
<section class="view" id="v-home">
  <header class="top">
    <button class="ib" id="menu" aria-label="القائمة"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <img class="logo" alt="B24 Portal">
  </header>
  <p class="hello">أهلاً بك</p><h1 id="hname">&nbsp;</h1>
  <label class="sw"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="ابحث عن خدمة" autocomplete="off"></label>
  <div class="list" id="list"></div>
  <nav class="tabs"><div>
    <button class="tab cur"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8.5a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1Z"/></svg>الرئيسية</button>
    <button class="tab soon"><svg viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15ZM10 21h4"/></svg>الإشعارات</button>
    <button class="tab soon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c.8-3.800 3.700-6 7.500-6s6.700 2.200 7.500 6"/></svg>حسابي</button>
  </div></nav>
</section>

<div class="scrim" id="scrim"></div>
<aside class="drawer">
  <div class="who"><div class="av" id="dav"></div><b id="dname"></b><br><small id="dnum"></small></div>
  <button class="mi soon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20c.8-3.800 3.700-6 7.500-6s6.700 2.200 7.500 6"/></svg>الملف الشخصي</button>
  <button class="mi soon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/></svg>عن التطبيق</button>
  <button class="mi out" id="logout"><svg viewBox="0 0 24 24"><path d="M10 4.5H6A1.500 1.500 0 0 0 4.500 6v12A1.500 1.500 0 0 0 6 19.500h4M15 8l4 4-4 4M19 12H9.500"/></svg>تسجيل الخروج</button>
</aside>
<div class="toast" id="toast"></div>

$('b-num').onclick=async function(){

  theNum=n;$('reg-num').textContent=n;show('v-reg');
};

  if(!e)return msg('m-reg','أدخل الإيميل');
  if(p.length<6)return msg('m-reg','كلمة السر أقل من 6 أحرف');
  if(p!==$('r-pw2').value)return msg('m-reg','كلمتا السر غير متطابقتين');
  busy(b,true);var r=await sb.auth.signUp({email:e,password:p,options:{data:{student_number:theNum}}});busy(b,false);
  if(r.error){var t=r.error.message||'';
    return msg('m-reg',/already|registered/i.test(t)?'هذا الإيميل مستخدم':/Database error|NUMBER_TAKEN|INVALID/i.test(t)?'تعذّر التسجيل بهذا الرقم، قد يكون مستخدماً':'تعذّر إنشاء الحساب: '+t)}
  if(!r.data.session)return msg('m-reg','تم إنشاء الحساب. فعّل خيار الدخول دون تأكيد الإيميل في Supabase ثم سجّل الدخول',true);
  enter();
};
$('b-login').onclick=async function(){
  var b=this;msg('m-login','');busy(b,true);
  var r=await sb.auth.signInWithPassword({email:$('l-email').value.trim(),password:$('l-pw').value});busy(b,false);
  if(r.error)return msg('m-login','الإيميل أو كلمة السر غير صحيحة');
  enter();
};
$('b-forgot').onclick=async function(){
  var b=this,e=$('f-email').value.trim();msg('m-forgot','');
  if(!e)return msg('m-forgot','أدخل إيميلك');
  busy(b,true);await sb.rpc('request_password_reset',{p_email:e});busy(b,false);
  msg('m-forgot','تم إرسال الطلب للإدارة. ستتواصل معك بكلمة مؤقتة.',true);
};

var services=[];
async function enter(){
  var u=(await sb.auth.getUser()).data.user;if(!u)return show('v-login');
  var p=(await sb.from('profiles').select('*').eq('id',u.id).single()).data;
  if(!p){await sb.auth.signOut();return show('v-login')}
  if(p.is_blocked){await sb.auth.signOut();show('v-login');return msg('m-login','هذا الحساب موقوف. تواصل مع الإدارة')}
  var nm=p.full_name||'طالب B24';
  $('hname').textContent=nm;$('dname').textContent=nm;$('dnum').textContent=p.student_number;$('dav').textContent=nm.charAt(0);
  var s=await sb.from('services').select('*').eq('is_active',true).order('sort_order');
  services=s.data||[];render('');show('v-home');
}
function render(q){
  var l=$('list'),items=services.filter(function(s){return !q||((s.title||'')+(s.description||'')).indexOf(q)>-1});
  l.innerHTML=items.length?'':'<p style="text-align:center;color:#5B6B80">لا توجد خدمة</p>';
  items.forEach(function(s){
    var b=document.createElement('button');b.className='card';
    b.innerHTML='<span class="ico"><svg viewBox="0 0 24 24">'+(ICONS[s.icon]||ICONS.link)+'</svg></span><span class="txt"><b>'+esc(s.title)+'</b><small>'+esc(s.description)+'</small></span><svg class="chev" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg>';
    b.onclick=function(){if(s.kind==='link'&&s.url){window.open(s.url,'_blank','noopener')}else{toast('قريباً')}};
    l.appendChild(b)});
}
$('q').oninput=function(){render(this.value.trim())};
$('menu').onclick=function(){document.body.classList.add('open')};
$('scrim').onclick=function(){document.body.classList.remove('open')};
$('logout').onclick=async function(){await sb.auth.signOut();document.body.classList.remove('open');show('v-login')};
sb.auth.getSession().then(function(r){if(r.data.session)enter()});
</script>
</body>
</html>
